<h2>Project Form</h2>

<form>
    <label>name</label>

    <input
        type="text"
        [(ngModel)]="project.name"
        name="name"
    >
    <label>StartDate</label>

    <input
        type="text"
        [(ngModel)]="project.StartDate"
        name="StartDate"
    >
    <label>EndDate</label>

    <input
        type="text"
        [(ngModel)]="project.EndDate"
        name="EndDate"
    >


    <button type="button">Save</button>
</form>

<table>
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>StartDate</th>
            <th>EndDate</th>

            <th>Actions</th>
        </tr>
        </thead>
    <tbody>
        @for (item of projects; track item.id){
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.StartDate }}</td>
                <td>{{ item.EndDate }}</td>
            </tr>
        }
    </tbody>
</table>
