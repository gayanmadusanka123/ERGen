<h2>Desk Form</h2>

<form>
    <label>name</label>

    <input
        type="text"
        [(ngModel)]="desk.name"
        name="name"
    >

    <label>Department</label>

    <select
        [(ngModel)]="desk.department"
        name="department"
    >
        <option [ngValue]="null">
            Select Department
        </option>

        <option
            *ngFor="let item of departments"
            [ngValue]="item">

            {{ item.name }}
        </option>
    </select>

    <button type="button">Save</button>
</form>

<table>
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>

            <th>Department</th>
            <th>Actions</th>
        </tr>
        </thead>
    <tbody>
        @for (item of desks; track item.id){
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.department.name }}</td>
            </tr>
        }
    </tbody>
</table>
